name: Release

# Publishes the SDK (jar + sources + javadoc) to GitHub Packages when a version tag is pushed.
# Kept separate from CI so day-to-day builds retain read-only permissions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK
        # actions/setup-java@v6.0.0 — configures a settings.xml whose "github" server authenticates with the
        # workflow token granted by `packages: write` above.
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN

      - name: Validate tag matches the POM version
        shell: bash
        run: |
          version="$(./mvnw --quiet --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Deploy (sources + javadoc + jar)
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
