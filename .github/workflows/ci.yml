name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests and release artifacts (JDK 25 LTS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1 pinned to a commit SHA for supply-chain safety.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 LTS
        # actions/setup-java@v5.7.0 pinned to a commit SHA.
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify release artifacts and Javadoc
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests -Prelease package
