name: CI

# `push` is scoped to the default branch and version tags so a pull request from a branch in this repository
# builds once (via `pull_request`) instead of twice.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests and release artifacts (JDK 25 LTS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1 pinned to a commit SHA for supply-chain safety.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 LTS
        # actions/setup-java@v6.0.0 pinned to a commit SHA.
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify release artifacts and Javadoc
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests -Prelease package
