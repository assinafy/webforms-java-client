name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The SDK compiles to Java 21 bytecode (the floor consumers must run); verify the test suite on the
        # supported floor (21) and the latest LTS (25). Add new LTS releases here as they ship.
        java: ["21", "25"]

    steps:
      - name: Check out repository
        # actions/checkout@v7.0.0 pinned to a commit SHA for supply-chain safety.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK ${{ matrix.java }}
        # actions/setup-java@v5.6.0 pinned to a commit SHA.
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress verify
